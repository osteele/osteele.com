[tasks.build]
description = "Build app"
run = "bun run build"

[tasks.build-prod]
description = "Build production app"
run = "bun run build:prod"

[tasks.check]
description = "Run all checks"
depends = ["lint", "typecheck", "test"]

[tasks.check-internal-links]
description = "Check internal links only"
run = "bun test src/lib/link-checker.test.ts"

[tasks.check-external-links]
description = "Run external link tests only (may take several minutes)"
run = [
    "bun run build > /dev/null",
    "bun run linkinator --skip https://www.linkedin.com/in/osteele --verbosity error dist"
]

[tasks.clean]
description = "Clean up"
run = "bun run clean"

[tasks.dev]
description = "Start development server"
run = "bun run dev"

[tasks.fix]
description = "Fix common lint errors"
run = "bun run fix"

[tasks.format]
description = "Format code"
run = "bun run format"

[tasks.lint]
description = "Run linting"
run = "bun run lint"

[tasks.test]
description = "Run all tests"
run = "bun test"

[tasks.test-unit]
description = "Run only unit tests (faster)"
run = "bun test --pattern \"**/*.test.ts\" --ignore \"**/integration.test.ts\""

[tasks.test-integration]
description = "Run only integration tests"
run = "bun test \"./src/lib/integration.test.ts\""

[tasks.typecheck]
description = "Run type checking"
run = "bun run typecheck"

[tasks.update-projects]
description = "Update project dates and URLs from GitHub"
run = 'uv --quiet run --project "${GITHUB_TURTLE_SYNC_DIR:-../../code/sync/github-turtle-sync}" github-turtle-sync --config config/github-turtle-sync.toml all'

[tasks.update-project-dates]
description = "Update project dates"
run = 'uv --quiet run --project "${GITHUB_TURTLE_SYNC_DIR:-../../code/sync/github-turtle-sync}" github-turtle-sync --config config/github-turtle-sync.toml dates'

[tasks.check-project-metadata]
description = "Check GitHub-derived metadata without writing"
run = 'uv --quiet run --project "${GITHUB_TURTLE_SYNC_DIR:-../../code/sync/github-turtle-sync}" github-turtle-sync --config config/github-turtle-sync.toml check --no-discover'

[tasks.discover-projects]
description = "List GitHub repositories missing from the project catalog"
run = 'uv --quiet run --project "${GITHUB_TURTLE_SYNC_DIR:-../../code/sync/github-turtle-sync}" github-turtle-sync --config config/github-turtle-sync.toml discover'

[tasks.list-projects]
description = "Smoke-test the project-sync integration without contacting GitHub"
run = 'uv --quiet run --project "${GITHUB_TURTLE_SYNC_DIR:-../../code/sync/github-turtle-sync}" github-turtle-sync --config config/github-turtle-sync.toml list'

[tasks.add-project-thumbnail]
description = "Add project thumbnail"
run = "uv --quiet run --script scripts/add_project_thumbnail.py"
